# Optional add-on: a trusted HTTPS address through Tailscale, at home and away.
#
# Gives Plinthio an address like https://plinthio.tail1234.ts.net that every device signed in
# to your tailnet trusts: no certificates to install, no router ports to open. The installed
# app's offline features work, and so do reading apps.
#
# 1. In the Tailscale admin console (login.tailscale.com/admin): DNS → turn on MagicDNS and
#    HTTPS Certificates. Settings → Keys → Generate auth key.
# 2. Next to docker-compose.yml, put this file, and add to your .env:
#      TS_AUTHKEY=tskey-auth-…
#      COMPOSE_FILE=docker-compose.yml:docker-compose.tailscale.yml
#    (No key? Leave TS_AUTHKEY out and sign in with the link `docker logs plinthio-tailscale`
#    prints.) Using the public-address add-on too? List all three files in COMPOSE_FILE.
# 3. docker compose up -d
# 4. Install Tailscale on each phone or computer, sign in, and open
#    https://plinthio.<your-tailnet>.ts.net  (the admin console lists the exact name).
#
# Friends without Tailscale: Funnel. Add TS_FUNNEL=true to .env (then run
# `docker compose up -d --force-recreate` if it's already running) and the same address opens
# in anyone's browser, with no domain and no router changes. Turn on outside access in
# Admin → Network first (and consider requiring two-factor away from home), and read
# docs/remote-access.md: Funnel goes through Tailscale's servers, which limit bandwidth.
#
# Tailscale runs in its own container with its own network, joined to Plinthio by a small
# private Docker network with fixed addresses. Tailscale's HTTPS front door (`tailscale serve`)
# hands requests to Plinthio over that network and passes each device's real address along,
# and Plinthio believes those forwarding headers from exactly one address: this container's
# (TRUST_PROXY below). Nothing else can pose as it: not a device on your home network, not
# the Docker host, and not a tailnet device connecting straight to port 8080, which now ends
# up inside this container where nothing is listening.
# (Earlier versions of this file had Tailscale share Plinthio's network. That let any
# tailnet device open http://<name>:8080 behind the front door, where it was taken for a
# home device and could make up its own address. If yours is one of those, see "Upgrading
# the add-ons" in docs/remote-access.md: replace this file and run
# `docker compose up -d --force-recreate`.)
#
# http://<server>:8088 on your home network keeps working as before. Tailscale devices count
# as home unless you change that in Admin → Network; Funnel visitors come from the internet
# and count as outside.
#
# The private network is 172.31.250.0/29. If Docker says it overlaps another network, pick a
# free one in .env, all four together (the public-address add-on reads the same settings):
#   PLINTHIO_PROXY_SUBNET=10.213.77.0/29
#   PLINTHIO_PROXY_APP_IP=10.213.77.2
#   PLINTHIO_PROXY_TAILSCALE_IP=10.213.77.3
#   PLINTHIO_PROXY_CADDY_IP=10.213.77.4
# Don't advertise that network as a Tailscale subnet route (TS_ROUTES): connections routed
# that way would reach Plinthio from this container's address and be believed.
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: plinthio-tailscale
    restart: unless-stopped
    networks:
      plinthio-proxy:
        ipv4_address: ${PLINTHIO_PROXY_TAILSCALE_IP:-172.31.250.3}
    depends_on:
      - plinthio
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-plinthio}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/serve.json
    configs:
      - source: tailscale-serve
        target: /serve.json
    volumes:
      - ./tailscale:/var/lib/tailscale

  plinthio:
    environment:
      # Exactly the two add-on addresses on the private network, never a whole range: the
      # network's own gateway (the Docker host) sits in that range and must not be believed.
      # Both are listed in both add-on files so that using the two together works; with only
      # this add-on, nothing holds the second address.
      - TRUST_PROXY=${PLINTHIO_PROXY_TAILSCALE_IP:-172.31.250.3},${PLINTHIO_PROXY_CADDY_IP:-172.31.250.4}
    networks:
      # `default` stays, so the published ports and anything else you attached keep working.
      default: {}
      plinthio-proxy:
        ipv4_address: ${PLINTHIO_PROXY_APP_IP:-172.31.250.2}

networks:
  plinthio-proxy:
    ipam:
      config:
        - subnet: ${PLINTHIO_PROXY_SUBNET:-172.31.250.0/29}

configs:
  # HTTPS on the tailnet name, handed to Plinthio at its fixed address. Funnel (the same
  # address, open to the internet) only with TS_FUNNEL=true; it must be exactly true or false.
  # $$ keeps Compose from filling in ${TS_CERT_DOMAIN}; Tailscale fills it in itself.
  tailscale-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://${PLINTHIO_PROXY_APP_IP:-172.31.250.2}:8080" } }
          }
        },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": ${TS_FUNNEL:-false} }
      }

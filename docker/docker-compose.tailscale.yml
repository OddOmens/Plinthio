# Optional add-on: a trusted HTTPS address through Tailscale, at home and away.
#
# Gives Plinthio an address like https://plinthio.tail1234.ts.net that every device signed in
# to your tailnet trusts: no certificates to install, no router ports to open. The installed
# app's offline features work, and so do reading apps.
#
# 1. In the Tailscale admin console (login.tailscale.com/admin): DNS → turn on MagicDNS and
#    HTTPS Certificates. Settings → Keys → Generate auth key.
# 2. Next to docker-compose.yml, put this file and a .env with:  TS_AUTHKEY=tskey-auth-…
#    (Or leave TS_AUTHKEY out and sign in with the link `docker logs plinthio-tailscale` shows.)
# 3. Start both:
#      docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#    and use the same two -f flags for every later `docker compose` command, including
#    updates. (Or set COMPOSE_FILE=docker-compose.yml:docker-compose.tailscale.yml in .env.)
# 4. Install Tailscale on each phone or computer, sign in, and open
#    https://plinthio.<your-tailnet>.ts.net  (the admin console lists the exact name).
#
# Plinthio shares this container's network, so http://<server>:8088 on your home network keeps
# working as before. Tailscale reaches Plinthio from 127.0.0.1 and passes the device's real
# address along, which is why TRUST_PROXY is set to loopback: only Tailscale's own connection
# is believed, and nothing on your network can fake its address.
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: plinthio-tailscale
    hostname: ${TS_HOSTNAME:-plinthio}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-plinthio}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/serve.json
    configs:
      - source: tailscale-serve
        target: /serve.json
    volumes:
      - ./tailscale:/var/lib/tailscale
    # Plinthio's ports move here, because Plinthio now uses this container's network.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8088:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:8443:8443"

  plinthio:
    network_mode: service:tailscale
    ports: !reset []
    depends_on:
      - tailscale
    environment:
      - TRUST_PROXY=loopback

configs:
  # HTTPS on the tailnet name, handed to Plinthio. Funnel (public internet) stays off.
  # $$ keeps Compose from filling in ${TS_CERT_DOMAIN}; Tailscale fills it in itself.
  tailscale-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://127.0.0.1:8080" } }
          }
        },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": false }
      }

# Keeps dependencies patched: a pull request when a new version (or a security fix) is out.
# Updates are grouped so there are only a few PRs to review: minor and patch updates in one
# PR per ecosystem, major versions in another (they can break things, so they're kept
# apart), and every GitHub Actions bump together. CI runs on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor:
        update-types: [minor, patch]
      backend-major:
        update-types: [major]
    ignore:
      # Upgraded by hand as its own piece of work: route patterns change in Express 5.
      - dependency-name: express
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]
    ignore:
      # Upgraded by hand as their own pieces of work: Tailwind 4 is a migration, and
      # vue-router 5 needs Vite 7+, so they move together with Vite.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-vue"
        update-types: [version-update:semver-major]
      - dependency-name: vue-router
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Node majors (and odd, non-LTS ones in particular) are moved by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes or writes back to the repository, so the token can only read it.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ffprobe is what the scanner reads durations with, so the duration tests only really
      # run where it's installed — locally they skip, here they don't.
      - name: Install ffmpeg, poppler and 7-Zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils 7zip

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check translations
        working-directory: frontend
        run: npm run check:i18n

      - name: Build
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)

      # The tests drive the built app served by the real backend (frontend/e2e/serve.mjs),
      # on a phone-sized screen: setup wizard, title page, and the manga reader.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is how Plinthio actually ships, and it has broken on its own before (a
      # non-free apt component that isn't enabled in the base image), so build it on every
      # change rather than finding out at release time.
      - name: Build image
        run: docker build -f docker/Dockerfile -t plinthio:ci .

      # Building isn't enough: a native module built for a newer glibc than the base image
      # has builds fine and then crashes on start. Boot it the way users do and wait for
      # the health check.
      - name: Start image and wait for it to be healthy
        run: |
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/media"
          docker run -d --name plinthio -p 8088:8080 \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/media:/media" plinthio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/api/health; then
              echo
              curl -fsS http://127.0.0.1:8088/ | grep -q '<div id="app"' || { echo "web app not served"; exit 1; }
              echo "web app served"
              exit 0
            fi
            sleep 2
          done
          docker logs plinthio
          exit 1

      - name: Stops cleanly on SIGTERM
        run: |
          start=$(date +%s)
          docker stop -t 30 plinthio
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          docker logs plinthio 2>&1 | tail -5
          [ "$took" -lt 10 ]
